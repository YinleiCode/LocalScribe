[project]
name = "scribe-py"
version = "1.0.3"
description = "LocalScribe Python sidecar — Whisper transcription + LLM correction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2",
    "asteroid-filterbanks==0.4.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fastapi>=0.115",
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio==0.3.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "huggingface_hub>=0.24",
    "jieba>=0.42.1,<1",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "silero-vad>=5.1",
    "soundfile>=0.12",
    "senko==0.1.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "resemblyzer>=0.1.4",
    "scikit-learn>=1.5",
    "python-multipart>=0.0.9",
    "pypinyin>=0.53,<1",
    "uvicorn>=0.30",
    "zhconv>=1.4.3",
]

[project.optional-dependencies]
ai-denoise = [
    "deepfilternet>=0.5.6",
]

[project.scripts]
scribe-py = "scribe_py.__main__:main"
localscribe-web = "scribe_py.web_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
